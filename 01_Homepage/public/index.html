<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

        <span class="brand-copy"><strong>YUN · GIL · LEE</strong><small>AI LEARNING COLLECTIVE</small></span>

      <div class="workspace-label">WORKSPACE</div>

        <button class="nav-link" data-page="schedule"><span class="nav-icon">▦</span><span>일정 투표</span><kbd>02</kbd></button>
        <button class="nav-link" data-page="meetings"><span class="nav-icon">▤</span><span>회의록</span><kbd>03</kbd></button>
        <button class="nav-link" data-page="items"><span class="nav-icon">◈</span><span>실행 아이템</span><kbd>04</kbd></button>

      <div class="sidebar-bottom">

        </div>
        <button class="nav-link guide-link" data-page="guide"><span class="nav-icon">ⓘ</span><span>스터디 운영 가이드</span><span class="guide-arrow">↗</span></button>

        <div class="breadcrumb"><span>YGL COLLECTIVE</span><b>/</b><strong id="breadcrumbCurrent">Overview</strong></div>

      <main id="mainContent" tabindex="-1"></main>
      <footer class="site-footer"><span>YGL — MONTHLY AI COLLECTIVE</span><span>THINK · TEST · TRANSFORM</span><span>© 2026 YGL</span></footer>
    </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importInput" accept="application/json,.json" hidden />
  <script src="app.js"></script>
